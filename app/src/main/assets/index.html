<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>毎日の計画</title>
<style>
:root{--main:#5c6bc0;--bg:#f5f6fb;--card:#fff;--txt:#222;--sub:#666}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;background:var(--bg);color:var(--txt);font-size:17px;padding-bottom:72px;-webkit-tap-highlight-color:transparent}
header{background:var(--main);color:#fff;padding:12px 16px;font-weight:bold;font-size:19px}
section{padding:12px}
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card>b:first-child{display:block;margin-bottom:6px;font-size:18px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.row:last-child{border-bottom:none}
.grow{flex:1}
.sub{font-size:14px;color:var(--sub)}
.mark{font-size:22px}
button{min-height:44px;min-width:44px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:16px;padding:0 12px;cursor:pointer}
button.ghost{background:#e3e6f5;color:#333}
button.del{background:#e57373}
input{font-size:16px;min-height:40px;padding:4px 8px;border:1px solid #bbb;border-radius:10px;max-width:100%}
.item{border:1px solid #e3e6f0;border-radius:12px;padding:8px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.days label{margin-right:6px}
.chara{text-align:center;margin:4px 0}
#chara{display:inline-block;cursor:pointer;-webkit-user-select:none;user-select:none}
#chara svg{width:150px;height:150px;animation:bounce 2.4s ease-in-out infinite}
#chara.squish svg{animation:squish .45s ease}
.bubble{background:#fff;border:2px solid var(--main);border-radius:16px;padding:10px 12px;margin:6px 0 10px;min-height:52px;font-size:18px}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.15,.85)}60%{transform:scale(.92,1.08)}100%{transform:scale(1,1)}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -1px 4px rgba(0,0,0,.1)}
nav button{flex:1;min-height:60px;border-radius:0;background:#fff;color:#555;font-size:17px}
nav button.act{color:var(--main);font-weight:bold}
</style>
</head>
<body>
<header>毎日の計画</header>

<section id="today">
  <div class="chara"><div id="chara" role="button" tabindex="0">
    <svg viewBox="0 0 200 200" aria-label="キャラクター">
      <ellipse cx="100" cy="115" rx="70" ry="62" fill="#ffd4e5" stroke="#e57aa0" stroke-width="4"/>
      <ellipse cx="100" cy="62" rx="8" ry="14" fill="#ffd4e5" stroke="#e57aa0" stroke-width="3"/>
      <circle cx="75" cy="105" r="8" fill="#333"/>
      <circle cx="125" cy="105" r="8" fill="#333"/>
      <circle cx="77" cy="102" r="3" fill="#fff"/>
      <circle cx="127" cy="102" r="3" fill="#fff"/>
      <ellipse cx="62" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity=".7"/>
      <ellipse cx="138" cy="128" rx="10" ry="6" fill="#ff8fb1" opacity=".7"/>
      <path d="M90 125 Q100 136 110 125" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div></div>
  <div class="bubble" id="bubble">おかえり！今日も一緒にがんばろうね。</div>
  <button class="ghost" id="speakToday" style="width:100%;margin-bottom:12px">今日のお知らせを聞く</button>
  <div class="card" id="items"></div>
  <div class="card" id="challenge"></div>
  <div class="card" id="tests"></div>
</section>

<section id="settings" hidden></section>

<nav>
  <button class="act" data-tab="today">今日</button>
  <button data-tab="settings">設定</button>
</nav>

<script>
const KEY='dailyPlanner.v2';
const DAYS=['月','火','水','木','金','土','日'];
const DEF={
  challenge:{name:'チャレンジ',unitsPerMonth:6,subjects:['国語','算数','理科','社会'],months:{}},
  items:[
    {id:'piano',name:'ピアノ',target:5,comment:'',days:[1,2,3,4,5,6,7],from:'',to:''},
    {id:'hw',name:'宿題',target:1,comment:'',days:[1,2,3,4,5,6,7],from:'',to:''}
  ],
  tests:[],
  voice:{1:{time:'16:00',msg:''},2:{time:'16:00',msg:''},3:{time:'16:00',msg:''},4:{time:'16:00',msg:''},5:{time:'16:00',msg:''},6:{time:'10:00',msg:''},7:{time:'10:00',msg:''}},
  log:{}
};

const hasAndroid=()=>typeof window.Android!=='undefined';

function load(){
  try{
    const raw=hasAndroid()?Android.getState():localStorage.getItem(KEY);
    if(raw) return {...structuredClone(DEF),...JSON.parse(raw)};
  }catch(e){}
  return structuredClone(DEF);
}
let st=load();

function save(){
  const raw=JSON.stringify(st);
  try{
    if(hasAndroid()) Android.setState(raw); else localStorage.setItem(KEY,raw);
  }catch(e){}
}

const p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const wd=()=>{const g=new Date().getDay();return g===0?7:g};
const ym=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);

function activeItems(){
  const d=today(),w=wd(),L=st.log[d]||{};
  return st.items
    .filter(o=>o.days.includes(w)&&(!o.from||d>=o.from)&&(!o.to||d<=o.to))
    .map(o=>({...o,done:L[o.id]||0}));
}
function chLeft(){
  const m=st.challenge.months[ym()]||{};
  return st.challenge.subjects.map(n=>({n,done:m[n]||0,left:Math.max(0,st.challenge.unitsPerMonth-(m[n]||0))}));
}
function upcomingTests(){
  const d=today();
  return st.tests.filter(t=>t.date&&t.date>=d).sort((a,b)=>a.date.localeCompare(b.date));
}

function renderToday(){
  const items=activeItems();
  document.getElementById('items').innerHTML='<b>今日</b>'+
    (items.length?'':'<div class="sub">今日の予定はありません</div>')+
    items.map(o=>`<div class="row" data-tap="${esc(o.id)}">
      <span class="mark">${o.done>=o.target?'✅':'⬜'}</span>
      <div class="grow">${esc(o.name)}${o.comment?`<div class="sub">${esc(o.comment)}</div>`:''}</div>
      <b>${o.done}/${o.target}</b></div>`).join('');

  document.getElementById('challenge').innerHTML=
    `<b>${esc(st.challenge.name)} ${parseInt(ym().slice(5))}月号</b>`+
    chLeft().map(c=>`<div class="row">
      <div class="grow">${esc(c.n)}</div>
      <span>残り <b>${c.left}</b></span>
      <button class="ghost" data-ch="${esc(c.n)}" data-d="-1">−</button>
      <button data-ch="${esc(c.n)}" data-d="1">＋</button></div>`).join('');

  const ts=upcomingTests();
  document.getElementById('tests').innerHTML='<b>テスト</b>'+
    (ts.length?'':'<div class="sub">テストの予定なし</div>')+
    ts.slice(0,3).map(t=>{
      const n=dayDiff(today(),t.date);
      return `<div class="row"><div class="grow">${esc(t.name)}</div><b>${n===0?'今日！':'あと'+n+'日'}</b></div>`;
    }).join('');
}

const bubble=document.getElementById('bubble');
function show(t){bubble.textContent=t}
function say(t){
  show(t);
  if(hasAndroid()){try{Android.speak(t)}catch(e){}}
}

const POKE=['なあに？','きゃっ！くすぐったい！','もうー、やめてよぉ〜','えへへ、うれしいな！','ぷにぷに…いいでしょ！'];
let pokes=0;
function poke(){
  pokes++;
  const c=document.getElementById('chara');
  c.classList.remove('squish'); void c.offsetWidth; c.classList.add('squish');
  say(pokes%7===0?'もう、いじわる〜！':POKE[pokes%POKE.length]);
}
function todayLine(){
  if(hasAndroid()){
    try{const t=Android.todayLine(); show(t); Android.speak(t);}
    catch(e){show('お知らせの読み込みに失敗しました')}
  }else{
    show('（アプリ版で聞くと声で話します）');
  }
}

document.getElementById('chara').addEventListener('click',poke);
document.getElementById('speakToday').addEventListener('click',todayLine);

document.getElementById('today').addEventListener('click',e=>{
  const row=e.target.closest('[data-tap]');
  if(row){
    const id=row.dataset.tap;
    const o=st.items.find(x=>x.id===id);
    if(!o) return;
    const d=today();
    st.log[d]=st.log[d]||{};
    const cur=st.log[d][id]||0;
    st.log[d][id]=cur>=o.target?0:cur+1;
    save(); renderToday(); return;
  }
  const ch=e.target.closest('[data-ch]');
  if(ch){
    const m=ym();
    st.challenge.months[m]=st.challenge.months[m]||{};
    const n=ch.dataset.ch;
    const cur=st.challenge.months[m][n]||0;
    st.challenge.months[m][n]=Math.max(0,Math.min(st.challenge.unitsPerMonth,cur+parseInt(ch.dataset.d)));
    save(); renderToday();
  }
});

function renderSettings(){
  const c=st.challenge, m=ym(), mm=c.months[m]||{};
  let h=`<div class="card"><b>教材</b>
    <div class="row"><span>名前</span><input id="cname" value="${esc(c.name)}" style="flex:1"></div>
    <div class="row"><span>1か月の単元数</span><input id="cunits" type="number" min="1" max="30" value="${c.unitsPerMonth}" style="width:90px"></div>
    <div class="sub" style="margin-top:6px">今月（${m}）の進み（終わった単元数）</div>
    ${c.subjects.map(n=>`<div class="row"><span class="grow">${esc(n)}</span>
      <input type="number" min="0" data-mdone="${esc(n)}" value="${mm[n]||0}" style="width:90px"></div>`).join('')}
  </div>`;

  h+=`<div class="card"><b>項目（ピアノ・宿題など）</b>`;
  st.items.forEach((o,i)=>{
    h+=`<div class="item" data-i="${i}">
      <div style="display:flex;gap:6px">
        <input data-k="name" value="${esc(o.name)}" placeholder="名前" style="flex:1">
        <input data-k="target" type="number" min="1" max="30" value="${o.target}" style="width:70px">回
      </div>
      <input data-k="comment" value="${esc(o.comment)}" placeholder="先生の言葉など（キャラが読み上げます）">
      <div class="days">${DAYS.map((n,j)=>`<label><input type="checkbox" data-k="day" data-v="${j+1}" ${o.days.includes(j+1)?'checked':''}>${n}</label>`).join('')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">期間
        <input type="date" data-k="from" value="${o.from}"> 〜 <input type="date" data-k="to" value="${o.to}">
      </div>
      <button class="del" data-del="item">この項目を削除</button>
    </div>`;
  });
  h+=`<button id="addItem" class="ghost" style="width:100%">項目を追加</button></div>`;

  h+=`<div class="card"><b>声（定時のお知らせ）</b>
    <div class="sub" style="margin-bottom:8px">時刻になると、その日の残りを話します。曜日ごとの一言も先に話します。</div>`;
  for(let w=1;w<=7;w++){
    const v=st.voice[w];
    h+=`<div class="item"><b>${DAYS[w-1]}曜</b>
      <input type="time" data-voice="${w}" data-k="time" value="${v.time}">
      <input data-voice="${w}" data-k="msg" value="${esc(v.msg)}" placeholder="例：今日はピアノの日だよ！"></div>`;
  }
  h+=`</div>`;

  h+=`<div class="card"><b>テスト</b>`;
  st.tests.forEach((t,i)=>{
    h+=`<div class="item" data-ti="${i}">
      <input data-tk="name" value="${esc(t.name)}" placeholder="テスト名">
      <div style="display:flex;gap:6px;align-items:center">
        <input type="date" data-tk="date" value="${t.date||''}">
        <button class="del" data-del="test">削除</button>
      </div></div>`;
  });
  h+=`<button id="addTest" class="ghost" style="width:100%">テストを追加</button></div>`;

  document.getElementById('settings').innerHTML=h;
}

const setEl=document.getElementById('settings');

setEl.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cname'){
    st.challenge.name=t.value.trim()||'チャレンジ';
  }else if(t.id==='cunits'){
    st.challenge.unitsPerMonth=Math.max(1,parseInt(t.value)||6);
  }else if(t.dataset.mdone!==undefined){
    const m=ym();
    st.challenge.months[m]=st.challenge.months[m]||{};
    st.challenge.months[m][t.dataset.mdone]=Math.max(0,parseInt(t.value)||0);
  }else if(t.dataset.voice){
    st.voice[t.dataset.voice][t.dataset.k]=t.value;
  }else if(t.closest('[data-i]')){
    const o=st.items[+t.closest('[data-i]').dataset.i];
    const k=t.dataset.k;
    if(k==='day'){
      const v=+t.dataset.v;
      o.days=t.checked?[...new Set([...o.days,v])].sort((a,b)=>a-b):o.days.filter(x=>x!==v);
    }else if(k==='target'){
      o.target=Math.max(1,parseInt(t.value)||1);
    }else{
      o[k]=t.value;
    }
  }else if(t.closest('[data-ti]')){
    st.tests[+t.closest('[data-ti]').dataset.ti][t.dataset.tk]=t.value;
  }
  save(); renderToday();
});

setEl.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='addItem'){
    st.items.push({id:'i'+Date.now(),name:'新しい項目',target:1,comment:'',days:[1,2,3,4,5],from:'',to:''});
  }else if(t.id==='addTest'){
    st.tests.push({name:'テスト',date:today()});
  }else if(t.dataset.del==='item'){
    st.items.splice(+t.closest('[data-i]').dataset.i,1);
  }else if(t.dataset.del==='test'){
    st.tests.splice(+t.closest('[data-ti]').dataset.ti,1);
  }else{
    return;
  }
  save(); renderSettings(); renderToday();
});

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('act',x===b));
  const isToday=b.dataset.tab==='today';
  document.getElementById('today').hidden=!isToday;
  setEl.hidden=isToday;
  if(isToday) renderToday(); else renderSettings();
}));

// ウィジェットで回数を進めた後に戻ってきたとき、最新の状態を読み直す
window.addEventListener('focus',()=>{st=load();renderToday();});

renderToday();
renderSettings();
</script>
</body>
</html>
