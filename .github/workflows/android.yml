name: build-apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-planner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "最新版" \
            --notes "自動ビルド ${GITHUB_SHA::7}" \
            --latest=false
